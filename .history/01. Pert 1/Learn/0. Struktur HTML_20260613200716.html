<!DOCTYPE html>             <!-- Memberitahu ke browser Bahwa ini adalah dokumen HTML -->
<html lang="en">            <!-- Memberutahu ke browser bahwa ini menggunakan bahasa inggris (en) -->
<head>                      <!-- Settingan Informasi yang diberikan ke browser -->
    <meta charset="UTF-8" />  <!-- Proses encoding Mengubah konten menjadi biner dan mengembalikan ke user dalam keadaan yg seharusnya -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Responsive di tablet / Smartphone -->
    <meta name="description" content="Latihan buat website" />
    <title>Document</title> <!-- Judul di tab bar-->
</head> 
<!-- Isi didalam browser -->
<body>
    <!-- Konten apapun -->
    <!-- Semantic HTML = Mempunyai makna/arti -->
<header>
    Ini Header
</header> <!-- Header (pembuatan website) -->
<nav>
    Ini Nav
</nav> <!-- Navigation (pembuatan menu) -->


<!-- List -->
<ul>
   <li>Bermain Game</li>
   <li>Ngoding</li>
</ul> <!-- Unorder list (List yant tidak berurutan) -->

<ol>
    <li>Bermain Game</li>
    <li>Ngoding</li>
</ol> <!-- Order list (List yang berurutan) -->

<nav>
    <ul>
        <li>Home</li>
        <li>TV Shows</li>
    </ul>
</nav>


<!-- Non semantic HTML = Tidak mempunyai arti -->
 <div></div>
 <span></span>
</body>
</html>
