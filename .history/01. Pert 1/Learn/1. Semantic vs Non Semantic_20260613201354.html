<!-- Semantic HTML = Mempunyai makna/arti -->
<header>
    Ini Header
</header> <!-- Header (pembuatan website) -->
<nav>
    Ini Nav
</nav> <!-- Navigation (pembuatan menu) -->

<!-- Point penting / Konten Utama -->
<main></main>

<!-- footer pada website -->
<footer></footer>

<!-- Pembuatan sidebar -->
<aside></aside>

<!-- Bebas sesuai kebutuhan untuk pembuatan tertentu -->
<section></section>





<!-- Non semantic HTML = Tidak mempunyai arti -->
 <div></div>
 <span></span>
