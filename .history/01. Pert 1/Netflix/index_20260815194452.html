<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header>
        <div class="logos">
            <a class="logo" href="#">NETFLIX</a>
            <ul>
                <li><a href="#">Home</a></a></li>
                <li><a href="#">TV Shows</a></a></li>
                <li><a href="#">Movies</a></a></li>
                <li><a href="#">News & Popular</a></a></li>
                <li><a href="#">My List</a></a></li>
                <li><a href="#">Browse by Languanges</a></a></li>
            </ul>
        </div>

        <button>Sign In</button>
    </header>

    <section class="content">
        <div class="popuplogin">
            <h3>Sign In</h3>

            <form action="">
                <div class="inputs">
                    <input class="c_username" type="text" placeholder="Username">
                    <input class="c_password" type="password" placeholder="Password">
                    <button type="button" class="c_login">Sign In</button>
                </div>

                <div class="checkremember">
                    <input type="checkbox" id="checkme">
                    <label for="checkme">Remember Me</label>
                </div>
                <p>This page is protected by Google ReCaptcha... <a href="#">Learn more</a></p>
            </form>
        </div>
    </section>

    <script src=""></script>
    <script src="./assets/script.js"></script>
</body>
</html>
