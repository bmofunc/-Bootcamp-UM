<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    
    <section class="content">
        <div class="popuplogin">
            <h3>Sign In</h3>

            <form action="">
                <div class="inputs">
                    <input class="c_username" type="text" placeholder="Username">
                    <input class="c_password" type="password" placeholder="Password">
                    <button type="button" class="c_login">Sign In</button>
                </div>

                <div class="checkremember">
                    <input type="checkbox" id="checkme">
                    <label for="checkme">Remember Me</label>
                </div>
                <p>This page is protected by Google ReCaptcha... <a href="#">Learn more</a></p>
            </form>
        </div>
    </section>

    <script src="./assets/global.js"></script>
    <script src="./assets/script.js"></script>
</body>
</html>
